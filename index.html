<!doctype html>
<html
  lang="pt-BR"
  class="min-h-full bg-ibiza-shell-day text-zinc-900 dark:bg-ibiza-shell dark:text-zinc-100"
  data-ui-theme="night"
>
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('radio_ibiza_ui_theme');
          if (t === 'day' || t === 'night') {
            document.documentElement.setAttribute('data-ui-theme', t);
          } else {
            document.documentElement.setAttribute('data-ui-theme', 'night');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-ui-theme', 'night');
        }
      })();
    </script>
    <style>
      html[data-ui-theme='night'],
      html[data-ui-theme='night'] body {
        margin: 0;
        min-height: 100%;
        background-color: #08080a;
        color: #f4f4f5;
      }
      html[data-ui-theme='day'],
      html[data-ui-theme='day'] body {
        margin: 0;
        min-height: 100%;
        background-color: #f4f2f8;
        color: #18181b;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="meta-theme-color" name="theme-color" content="#08080a" />
    <meta name="application-name" content="Player Radio Ibiza" />
    <title>Player Radio Ibiza</title>
  </head>
  <body
    class="min-h-full min-h-dvh bg-ibiza-shell-day font-sans text-zinc-900 antialiased dark:bg-ibiza-shell dark:text-zinc-100"
  >
    <div id="root"></div>
    <!--
      Netlify Forms (`player-feedback`) — campos: nome_cliente, nome_pdv, mensagem.
      E-mail: Netlify → Forms → player-feedback → Notifications (ex.: feedback@radioibiza.com.br).

      Netlify Forms (`radio-ibiza-cadastro-loja`) — primeira instalação: contactos da loja.
      E-mail: Netlify → Forms → radio-ibiza-cadastro-loja → Notifications → cadastro@radioibiza.com.br
    -->
    <form
      name="player-feedback"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="feedback-bot-field"
      hidden
    >
      <input type="text" name="nome_cliente" />
      <input type="text" name="nome_pdv" />
      <input type="text" name="mensagem" />
      <input name="feedback-bot-field" />
    </form>
    <form
      name="radio-ibiza-cadastro-loja"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="cadastro-bot-field"
      hidden
    >
      <input type="text" name="nome_pdv" />
      <input type="text" name="whatsapp_loja" />
      <input type="text" name="email_loja" />
      <input type="text" name="email_cobranca" />
      <input type="text" name="cliente_id" />
      <input type="text" name="pdv_id" />
      <input name="cadastro-bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
