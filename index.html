<!doctype html>
<html lang="pt-BR" class="min-h-full bg-ibiza-shell text-zinc-100">
  <head>
    <meta charset="UTF-8" />
    <!-- Fundo escuro antes do CSS do bundle (evita página “branca” em redes lentas / PWA) -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #08080a;
        color: #f4f4f5;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080a" />
    <meta name="application-name" content="Player Radio Ibiza" />
    <title>Player Radio Ibiza</title>
  </head>
  <body class="min-h-full min-h-dvh bg-ibiza-shell font-sans text-zinc-100 antialiased">
    <div id="root"></div>
    <!--
      Netlify Forms (`player-feedback`) — campos: nome_cliente, nome_pdv, mensagem.
      Destino do e-mail: Netlify Dashboard → Forms → Este formulário → Notifications → feedback@radioibiza.com.br
    -->
    <form
      name="player-feedback"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="feedback-bot-field"
      hidden
    >
      <input type="text" name="nome_cliente" />
      <input type="text" name="nome_pdv" />
      <input type="text" name="mensagem" />
      <input name="feedback-bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
