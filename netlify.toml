[build]
  command = "npm run build"
  publish = "dist"

  # Igual ao proxy do Vite em dev (`/api` → CakePHP): o browser só fala com
  # *.netlify.app; não depende de CORS no cloud para POST/GET do webservice.
  [build.environment]
    VITE_WEBSERVICE_URL = "/api"

# Formulários Netlify (ver `index.html` — forms estáticos). Destino do e-mail:
# Site settings → Forms → [nome] → Form notifications → Email
# - player-feedback → ex.: feedback@radioibiza.com.br
# - radio-ibiza-cadastro-loja → ex.: cadastro@radioibiza.com.br (primeira instalação / dados da loja)

# -----------------------------------------------------------------------------
# Headers de segurança aplicados a TODAS as respostas servidas pelo Netlify.
#
# Especialmente importantes neste projeto porque o token de sessão é colocado
# na query string (`?token=...`) — exigência do CakePHP legado, que não pode
# ser alterado. Os headers abaixo evitam que esse token vaze via `Referer`
# para domínios externos, que o site seja embarcado em iframes alheios, etc.
#
# Auditado em PENTEST 2026-05-13 (ver `docs/PENTEST-2026-05-13.md`).
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # «no-referrer» é o mais restrito; evita 100% do leak de token via Referer.
    # Se um dia precisarmos de referrer para analytics, mudar para `same-origin`.
    Referrer-Policy = "no-referrer"

    # MIME sniffing fora — browsers só executam Content-Type declarado.
    X-Content-Type-Options = "nosniff"

    # Não permitir que o player seja embarcado em iframe externo
    # (clickjacking + risco de iframe roubar token via DevTools).
    X-Frame-Options = "DENY"

    # HSTS: força HTTPS por 1 ano em qualquer subdomínio Netlify.
    # `preload` só se o domínio for próprio e estiver na lista; aqui ficamos no básico.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Bloqueia explicitamente APIs sensíveis que o player não usa.
    # Vale também como vacina contra dependência futura que peça acesso sem aviso.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()"

    # COOP isola o contexto do browser: se um tab nosso abrir outro site (ou vice-versa),
    # eles não compartilham `window.opener` / não se afetam mutuamente. Equivalente
    # moderno e mais forte do que o `target="_blank" rel="noopener"` que já usamos
    # em links externos. Vacina barata contra futuras dependências/popups —
    # auditoria externa RH-1 (2026-05-13).
    Cross-Origin-Opener-Policy = "same-origin"

    # CSP em modo *report-only*: violações são logadas no DevTools sem bloquear nada.
    # Permite afinar a política em produção (vendo o que quebra com tráfego real
    # de PDVs) antes de promover para `Content-Security-Policy` (bloqueante).
    # Plano: 2 semanas em report-only com PDVs reais, depois enforce.
    #
    # Hosts permitidos:
    # - `self`                                — o próprio domínio do PWA.
    # - `fonts.googleapis.com` (CSS de fontes) e `fonts.gstatic.com` (woff2).
    # - Stream de áudio e webservice CakePHP entram via `self` (proxy `/api/*` e
    #   `/ws-get_musica_cloud` declarados em `redirects` mais abaixo).
    # - `'unsafe-inline'` em style é necessário por causa do `<style>` de
    #   fallback no `index.html` e ~4 `style={{}}` inline em JSX (Tailwind cobre
    #   o grosso, mas alguns gradientes dinâmicos exigem inline).
    # - `script-src` sem `'unsafe-inline'` nem `'unsafe-eval'` — bundle Vite usa
    #   só `<script type="module" src="/assets/*.js">`.
    # - `frame-ancestors 'none'` reforça o `X-Frame-Options: DENY` acima.
    # - Auditoria externa M4 / 2026-05-13 (§11).
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Evita que CDN/browser fiquem semanas com `index.html` ou SW antigos — o JS em
# `/assets/*` já tem hash no nome e pode cachear forte.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Versão interna do shell (micro-releases); tem de ser sempre lida na rede.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Guia de instalação (HTML estático): sempre revalidar para não ficar preso a deploy antigo.
[[headers]]
  for = "/instalar.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/instalar"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/instalar-exe-indisponivel.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/m/instalar.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/m/instalar"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Bloqueia distribuição dos `.map`. O Vite + PWA do Workbox **precisa** gerar
# sourcemaps no `dist/` (sem isso o terser quebra ao montar o SW), mas em
# produção não queremos que um atacante baixe e reconstrua o TypeScript.
#
# A regra responde 404 antes de qualquer outro redirect. Localmente os mapas
# continuam disponíveis (`vite preview` lê do disco).
[[redirects]]
  from = "/assets/*.map"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.map"
  to = "/404.html"
  status = 404
  force = true

# Proxy: nunca deixar o browser cachear respostas do webservice como se fossem estáticas.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/ws-get_musica_cloud"
  [headers.values]
    Cache-Control = "private, no-store"

# Netlify Functions: respostas dinâmicas (TTS por placa, etc.). Não devem ser
# cacheadas por CDN/browser, mesmo que a Function por engano omita o header.
# Defesa em profundidade — auditoria externa RH-3 (2026-05-13).
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "private, no-store"

# Rotas do SPA (ex.: /login) — HTML shell sem cache longo (mais específico que `/*` só onde necessário).
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Proxy da API antes do SPA — ordem importa.
[[redirects]]
  from = "/api/*"
  to = "https://cloud.radioibiza.com.br/services/webservice/:splat"
  status = 200

# Stream de faixas via get_musica — mesma origem que o PWA (evita mixed content / CORS no <audio> e no fetch).
[[redirects]]
  from = "/ws-get_musica_cloud"
  to = "https://cloud.radioibiza.com.br/services/webservice/get_musica/"
  status = 200
  force = true

# Página estática de instalação PWA (public/instalar.html → dist/instalar.html).
# `200` = rewrite (sem 301): evita o browser “grudar” em redirect permanente com HTML antigo.
[[redirects]]
  from = "/instalar"
  to = "/instalar.html"
  status = 200

# Guia PWA — shell mobile (`public/m/instalar.html`).
[[redirects]]
  from = "/m/instalar"
  to = "/m/instalar.html"
  status = 200

# URL memorável → mesmo HTML que `/m/instalar`.
[[redirects]]
  from = "/installmobile"
  to = "/m/instalar.html"
  status = 302

# Instalador desktop: ficheiro estático. Tem de vir ANTES do /* → index.html da SPA;
# senão o React Router apanha path="*" e manda para /login.
[[redirects]]
  from = "/instalador-desktop"
  to = "/instalador-desktop/index.html"
  status = 200

[[redirects]]
  from = "/instalador-desktop/"
  to = "/instalador-desktop/index.html"
  status = 200

# Sem ficheiro em dist/install/*, o Netlify aplicava /* → index.html (login da SPA).
# Ficheiros reais em publish/public continuam a ter prioridade (redirect só se faltar).
[[redirects]]
  from = "/install/*"
  to = "/instalar-exe-indisponivel.html"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
