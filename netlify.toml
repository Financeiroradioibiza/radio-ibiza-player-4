[build]
  command = "npm run build"
  publish = "dist"

  # Igual ao proxy do Vite em dev (`/api` → CakePHP): o browser só fala com
  # *.netlify.app; não depende de CORS no cloud para POST/GET do webservice.
  [build.environment]
    VITE_WEBSERVICE_URL = "/api"

# Formulário `player-feedback` (index.html): notificações → feedback@radioibiza.com.br
# Netlify Dashboard → Forms → player-feedback → Form notifications → Add notification → Email

# Evita que CDN/browser fiquem semanas com `index.html` ou SW antigos — o JS em
# `/assets/*` já tem hash no nome e pode cachear forte.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Proxy: nunca deixar o browser cachear respostas do webservice como se fossem estáticas.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"

[[headers]]
  for = "/ws-get_musica_cloud"
  [headers.values]
    Cache-Control = "private, no-store"

# Rotas do SPA (ex.: /login) — HTML shell sem cache longo (mais específico que `/*` só onde necessário).
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Proxy da API antes do SPA — ordem importa.
[[redirects]]
  from = "/api/*"
  to = "https://cloud.radioibiza.com.br/services/webservice/:splat"
  status = 200

# Stream de faixas via get_musica — mesma origem que o PWA (evita mixed content / CORS no <audio> e no fetch).
[[redirects]]
  from = "/ws-get_musica_cloud"
  to = "https://cloud.radioibiza.com.br/services/webservice/get_musica/"
  status = 200
  force = true

# Página estática de instalação PWA (public/instalar.html → dist/instalar.html)
[[redirects]]
  from = "/instalar"
  to = "/instalar.html"
  status = 301

# Instalador desktop: ficheiro estático. Tem de vir ANTES do /* → index.html da SPA;
# senão o React Router apanha path="*" e manda para /login.
[[redirects]]
  from = "/instalador-desktop"
  to = "/instalador-desktop/index.html"
  status = 200

[[redirects]]
  from = "/instalador-desktop/"
  to = "/instalador-desktop/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
