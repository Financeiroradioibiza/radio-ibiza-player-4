[build]
  command = "npm run build"
  publish = "dist"

  # Igual ao proxy do Vite em dev (`/api` → CakePHP): o browser só fala com
  # *.netlify.app; não depende de CORS no cloud para POST/GET do webservice.
  [build.environment]
    VITE_WEBSERVICE_URL = "/api"

# Formulário estático `player-feedback` em index.html — ative e-mail em Site settings → Forms.

# Proxy da API antes do SPA — ordem importa.
[[redirects]]
  from = "/api/*"
  to = "https://cloud.radioibiza.com.br/services/webservice/:splat"
  status = 200

# Stream de faixas via get_musica — mesma origem que o PWA (evita mixed content / CORS no <audio> e no fetch).
[[redirects]]
  from = "/ws-get_musica_cloud"
  to = "https://cloud.radioibiza.com.br/services/webservice/get_musica/"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
