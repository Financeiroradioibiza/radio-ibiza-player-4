<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="ibiza-install-build" content="__IBIZA_INSTALL_BUILD__">
<meta name="description" content="Instalar o Player Radio Ibiza">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<title>Instalar · Radio Ibiza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#09090b">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    min-height: 100vh;
    color: #fafafa;
    background: #09090b;
    background-image:
      radial-gradient(ellipse 120% 80% at 50% -20%, rgba(219, 39, 119, 0.35), transparent 55%),
      radial-gradient(ellipse 90% 60% at 100% 50%, rgba(168, 85, 247, 0.2), transparent 45%),
      radial-gradient(ellipse 70% 50% at 0% 80%, rgba(250, 204, 21, 0.12), transparent 50%);
  }
  .wrap {
    max-width: 400px;
    margin: 0 auto;
    padding: 2rem 1.25rem 2.5rem;
    position: relative;
    z-index: 1;
  }
  .logo {
    width: 56px; height: 56px;
    border-radius: 14px;
    margin-bottom: 1.25rem;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: linear-gradient(145deg, rgba(219, 39, 119, 0.35), rgba(168, 85, 247, 0.25));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo img { width: 34px; height: 34px; }
  h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.2;
    background: linear-gradient(90deg, #fda4af, #fbbf24, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 0.5rem;
  }
  .lead {
    font-size: 0.9375rem;
    color: #a1a1aa;
    line-height: 1.55;
    margin-bottom: 1.5rem;
  }
  .card {
    border-radius: 1.25rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(24, 24, 27, 0.85);
    backdrop-filter: blur(10px);
    padding: 1.35rem 1.25rem;
    margin-bottom: 1.75rem;
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.75);
  }
  .btn {
    display: flex;
    width: 100%;
    justify-content: center;
    align-items: center;
    padding: 0.9rem 1rem;
    border-radius: 0.875rem;
    font-family: inherit;
    font-size: 0.9375rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: filter 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.99); }
  .btn-primary {
    color: #fff;
    background: linear-gradient(90deg, #db2777, #a855f7, #c026d3);
    box-shadow: 0 10px 30px -8px rgba(219, 39, 119, 0.55);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-secondary {
    margin-top: 0.65rem;
    background: rgba(39, 39, 42, 0.95);
    color: #e4e4e7;
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-weight: 600;
    font-size: 0.8125rem;
  }
  .btn-secondary:hover { background: #3f3f46; }
  .caption {
    margin-top: 0.85rem;
    font-size: 0.75rem;
    line-height: 1.45;
    color: #71717a;
  }
  .link-enter {
    display: block;
    text-align: center;
    margin-top: 1.1rem;
    font-size: 0.8125rem;
    font-weight: 600;
    color: #fde047;
    text-decoration: none;
  }
  .link-enter:hover { text-decoration: underline; }
  .wa-title {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #71717a;
    margin-bottom: 0.65rem;
  }
  .wa-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.5rem;
  }
  @media (min-width: 380px) {
    .wa-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .wa-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.65rem 0.5rem;
    border-radius: 0.75rem;
    font-size: 0.6875rem;
    font-weight: 700;
    text-decoration: none;
    color: #ecfccb;
    background: rgba(22, 101, 52, 0.45);
    border: 1px solid rgba(74, 222, 128, 0.45);
    transition: background 0.15s;
  }
  .wa-btn:hover { background: rgba(34, 197, 94, 0.35); }
  .hidden { display: none !important; }
  .standalone-note {
    font-size: 0.875rem;
    color: #a3e635;
    margin-bottom: 0.75rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo" aria-hidden="true">
      <img src="/icon.svg" alt="" width="34" height="34">
    </div>
    <h1>Bem-vindo</h1>
    <p class="lead">Radio Ibiza Player — música ambiente na sua loja ou espaço.</p>

    <div class="card hidden" id="boxStandalone">
      <p class="standalone-note">Você já está no aplicativo instalado.</p>
      <a class="btn btn-primary" href="/login" style="text-decoration:none">Entrar com e-mail</a>
    </div>

    <div class="card" id="boxInstall">
      <button type="button" class="btn btn-primary" id="btnMain">Instalar aplicativo</button>
      <button type="button" class="btn btn-secondary hidden" id="btnWinExe">Baixar instalador Windows (.exe)</button>
      <p class="caption" id="caption"></p>
      <a class="link-enter" href="/login">Já tenho conta — entrar</a>
    </div>

    <p class="wa-title">WhatsApp</p>
    <div class="wa-grid">
      <a class="wa-btn" href="https://wa.me/5521997595141" target="_blank" rel="noopener noreferrer">Suporte</a>
      <a class="wa-btn" href="https://wa.me/5521998314822" target="_blank" rel="noopener noreferrer">Financeiro</a>
      <a class="wa-btn" href="https://wa.me/5521997040227" target="_blank" rel="noopener noreferrer">Atendimento</a>
    </div>
  </div>

<script>
(function () {
  var WIN_EXE = (function () {
    try {
      return new URL('/install/RadioIbiza-Setup.exe', window.location.origin).href;
    } catch (e) {
      return '/install/RadioIbiza-Setup.exe';
    }
  })();

  var deferred = null;
  var btnMain = document.getElementById('btnMain');
  var btnWinExe = document.getElementById('btnWinExe');
  var caption = document.getElementById('caption');
  var boxInstall = document.getElementById('boxInstall');
  var boxStandalone = document.getElementById('boxStandalone');

  var isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  function isWindows() {
    return /Win/i.test(navigator.platform || '') || /Windows/i.test(navigator.userAgent || '');
  }

  if (isStandalone) {
    boxInstall.classList.add('hidden');
    boxStandalone.classList.remove('hidden');
    return;
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    caption.textContent =
      'Ao tocar em «Instalar aplicativo», o navegador abre o assistente aqui nesta página — sem redirecionar para o login.';
  });

  if (isWindows()) {
    btnWinExe.classList.remove('hidden');
    caption.innerHTML =
      '<strong style="color:#e4e4e7">Windows:</strong> recomendamos o app pelo Edge ou Chrome (botão acima). O <strong>.exe</strong> é para quem precisa do instalador completo no computador.';
  } else {
    caption.textContent =
      'Use Chrome ou Edge. Se o botão não abrir o assistente, abra o menu ⋮ e procure «Instalar aplicativo» nesta página.';
  }

  btnMain.addEventListener('click', function () {
    if (deferred) {
      var ev = deferred;
      try {
        ev.prompt();
      } catch (err) {
        deferred = null;
      }
      var p = ev.userChoice;
      if (p && typeof p.then === 'function') {
        p.then(function () {
          deferred = null;
        }).catch(function () {
          deferred = null;
        });
      } else {
        deferred = null;
      }
      return;
    }
    caption.innerHTML =
      '<strong style="color:#fde047">O navegador não ofereceu o assistente.</strong> Use o menu <strong>⋮</strong> (ou ⊕) → <strong>Instalar aplicativo</strong> nesta página. No Windows, pode usar também o botão do <strong>.exe</strong>, se existir no servidor.';
  });

  btnWinExe.addEventListener('click', function () {
    window.location.href = WIN_EXE;
  });

  /* Página estática: após `vite build`, vira o valor de `ibizaShellVersion` (package.json). */
  window.INSTALAR_PAGE_REV = '__IBIZA_INSTALL_BUILD__';

  window.addEventListener('appinstalled', function () {
    var keep = 'radio-ibiza-audio-v1';
    Promise.resolve()
      .then(function () {
        if ('serviceWorker' in navigator) {
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) {
              return r.unregister();
            }));
          });
        }
      })
      .then(function () {
        if ('caches' in window) {
          return caches.keys().then(function (keys) {
            return Promise.all(
              keys
                .filter(function (k) { return k !== keep; })
                .map(function (k) { return caches.delete(k); }),
            );
          });
        }
      })
      .then(function () {
        window.location.reload();
      })
      .catch(function () {
        window.location.reload();
      });
  });
})();
</script>
</body>
</html>
